name: Publish verified DevCat prerelease
on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Reviewed prerelease plan
        required: true
        default: docs/releases/v0.9.2-prerelease-plan.json
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-devcat
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate, publish checked assets and mark prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLAN: ${{ inputs.manifest }}
        run: python3 scripts/publish_prerelease.py "$RELEASE_PLAN"
