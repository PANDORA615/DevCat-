name: Transfer large Android build inputs
on:
  push:
    branches: ['transfer-android/**']
    paths: ['.github/workflows/transfer-android.yml']
  workflow_dispatch:
    inputs:
      build_run:
        description: Source CI run
        required: true
        default: '40601191818'
      build_commit:
        description: Verified application source commit
        required: true
        default: d43bb71edd260fdc83e074dad360efc13bd1039d
permissions:
  contents: read
  actions: read
jobs:
  split:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        abi: [universal]
    env:
      SOURCE_RUN: ${{ inputs.build_run || '40601191818' }}
      SOURCE_COMMIT: ${{ inputs.build_commit || 'd43bb71edd260fdc83e074dad360efc13bd1039d' }}
      SOURCE_ABI: ${{ matrix.abi }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify source commit and wait for the matching completed artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, time
          repository = os.environ['GITHUB_REPOSITORY']
          run = os.environ['SOURCE_RUN']
          assert run.isdigit()
          expected = os.environ['SOURCE_COMMIT']
          assert re.fullmatch(r'[0-9a-f]{40}', expected)
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repository}/{path}']))
          assert api(f'actions/runs/{run}')['head_sha'] == expected
          name = 'devcat-android-build-inputs-' + os.environ['SOURCE_ABI']
          for attempt in range(120):
              if any(a['name'] == name for a in api(f'actions/runs/{run}/artifacts')['artifacts']):
                  break
              time.sleep(15)
          else:
              raise RuntimeError('Matching source APK artifact did not become available')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: devcat-android-build-inputs-${{ matrix.abi }}
          path: input
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
      - name: Split public APK into verified parts below connector size limit
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          files = list(Path('input').glob('*.apk'))
          assert len(files) == 1
          apk = files[0]
          assert apk.name == 'app-release.apk'
          output = Path('transfer'); output.mkdir()
          manifest = {'buildRun': int(os.environ['SOURCE_RUN']), 'buildCommit': os.environ['SOURCE_COMMIT'], 'name': apk.name, 'bytes': apk.stat().st_size, 'parts': []}
          total = hashlib.sha256()
          with apk.open('rb') as source:
              for index in range(8):
                  name = apk.name + f'.part{index}'
                  digest = hashlib.sha256(); size = 0
                  with (output / name).open('wb') as target:
                      while size < 256 * 1024 * 1024:
                          block = source.read(min(1024 * 1024, 256 * 1024 * 1024 - size))
                          if not block: break
                          target.write(block); digest.update(block); total.update(block); size += len(block)
                  if not size:
                      (output / name).unlink()
                      break
                  manifest['parts'].append({'name': name, 'bytes': size, 'sha256': digest.hexdigest()})
              assert not source.read(1), 'Unexpected APK size above 2 GiB'
          assert sum(p['bytes'] for p in manifest['parts']) == manifest['bytes']
          manifest['sha256'] = total.hexdigest()
          (output / (apk.name + '.parts.json')).write_text(json.dumps(manifest, indent=2) + '\n')
          print(apk.name, manifest['bytes'], manifest['sha256'])
          PY
      - uses: actions/upload-artifact@v4
        if: hashFiles('transfer/*.part0') != ''
        with:
          name: devcat-apk-universal-part0
          path: |
            transfer/*.part0
            transfer/*.parts.json
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: hashFiles('transfer/*.part1') != ''
        with:
          name: devcat-apk-universal-part1
          path: |
            transfer/*.part1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: hashFiles('transfer/*.part2') != ''
        with:
          name: devcat-apk-universal-part2
          path: |
            transfer/*.part2
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: hashFiles('transfer/*.part3') != ''
        with:
          name: devcat-apk-universal-part3
          path: |
            transfer/*.part3
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: hashFiles('transfer/*.part4') != ''
        with:
          name: devcat-apk-universal-part4
          path: |
            transfer/*.part4
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: hashFiles('transfer/*.part5') != ''
        with:
          name: devcat-apk-universal-part5
          path: |
            transfer/*.part5
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: hashFiles('transfer/*.part6') != ''
        with:
          name: devcat-apk-universal-part6
          path: |
            transfer/*.part6
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: hashFiles('transfer/*.part7') != ''
        with:
          name: devcat-apk-universal-part7
          path: |
            transfer/*.part7
          compression-level: 0
          if-no-files-found: error
