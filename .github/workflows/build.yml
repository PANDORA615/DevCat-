name: Build and verify DevCat
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y clang libsqlite3-dev
      - working-directory: apps/devcat_flutter
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          DEVCAT_REQUIRE_ALL_TOOLCHAINS=true flutter test --reporter expanded
      - run: python3 scripts/write_content.py && git diff --exit-code -- content apps/devcat_flutter/assets/content
  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
          - os: windows-2022
            target: windows
          - os: macos-14
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good rpm zstd
      - working-directory: apps/devcat_flutter
        run: flutter pub get --enforce-lockfile
      - working-directory: apps/devcat_flutter
        run: flutter build ${{ matrix.target }} --release
      - if: matrix.target == 'linux'
        run: scripts/package_linux.sh 0.2.0
      - if: matrix.target == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Compress-Archive -Path apps/devcat_flutter/build/windows/x64/runner/Release/* -DestinationPath dist/DevCat-0.2.0-windows-x64.zip
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" scripts/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: matrix.target == 'macos'
        run: |
          mkdir -p dist
          app=apps/devcat_flutter/build/macos/Build/Products/Release/DevCat.app
          codesign --force --deep --sign - "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/DevCat-0.2.0-macos-universal.zip
          mkdir -p /tmp/devcat-dmg
          ditto "$app" /tmp/devcat-dmg/DevCat.app
          ln -s /Applications /tmp/devcat-dmg/Applications
          hdiutil create -volname DevCat -srcfolder /tmp/devcat-dmg -ov -format UDZO dist/DevCat-0.2.0-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: devcat-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.zst
            dist/*.AppImage
            dist/*.zip
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
  android:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/flutter
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Configure persistent signing when owner has installed secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/android_signing_config.py
      - working-directory: apps/devcat_flutter
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release --split-per-abi
          flutter build apk --release
          flutter build appbundle --release
      - run: |
          mkdir -p dist/android-build-inputs
          cp apps/devcat_flutter/build/app/outputs/flutter-apk/*.apk dist/android-build-inputs/
          cp apps/devcat_flutter/build/app/outputs/bundle/release/*.aab dist/android-build-inputs/
      - uses: actions/upload-artifact@v4
        with:
          name: devcat-android-build-inputs
          path: dist/android-build-inputs/*
          if-no-files-found: error
# Publication is separate from builds: Android inputs must be signed with the persistent owner key.
