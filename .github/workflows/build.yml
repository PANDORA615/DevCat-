name: Build and verify DevCat
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-device:
    uses: ./.github/workflows/android-runtime.yml
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y clang libsqlite3-dev
      - name: Initialize .NET before concurrent compiler tests
        run: dotnet --version
      - working-directory: apps/devcat_flutter
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          DEVCAT_REQUIRE_ALL_TOOLCHAINS=true flutter test --reporter expanded --concurrency=2
      - run: python3 scripts/write_content.py && python3 -m unittest discover -s scripts -p 'test_*.py' -v && git diff --exit-code -- content apps/devcat_flutter/assets/content docs/textbooks docs/DevCat-lectures.zip
  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
          - os: windows-2022
            target: windows
          - os: macos-14
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good rpm zstd
      - working-directory: apps/devcat_flutter
        run: flutter pub get --enforce-lockfile
      - working-directory: apps/devcat_flutter
        run: flutter build ${{ matrix.target }} --release
      - if: matrix.target == 'linux'
        run: scripts/package_linux.sh 0.4.0
      - if: matrix.target == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Compress-Archive -Path apps/devcat_flutter/build/windows/x64/runner/Release/* -DestinationPath dist/DevCat-0.4.0-windows-x64.zip
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" scripts/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: matrix.target == 'macos'
        run: |
          mkdir -p dist
          app=apps/devcat_flutter/build/macos/Build/Products/Release/DevCat.app
          codesign --force --deep --sign - "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/DevCat-0.4.0-macos-universal.zip
          mkdir -p /tmp/devcat-dmg
          ditto "$app" /tmp/devcat-dmg/DevCat.app
          ln -s /Applications /tmp/devcat-dmg/Applications
          hdiutil create -volname DevCat -srcfolder /tmp/devcat-dmg -ov -format UDZO dist/DevCat-0.4.0-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: devcat-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.zst
            dist/*.AppImage
            dist/*.zip
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
  android-image:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: android-arm64
          - abi: armeabi-v7a
            target: android-arm
          - abi: x86_64
            target: android-x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/flutter
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache/restore@v4
        id: runtime-cache
        with:
          path: build/android-runtime-image
          key: android-runtime-${{ matrix.abi }}-${{ hashFiles('scripts/build_android_rootfs.py', 'scripts/android_runtime_versions.json') }}
      - name: Build offline compiler image
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/android-runtime-image
          docker run --rm --mount type=bind,src="$PWD",dst=/src -w /src debian:bookworm-slim bash -lc 'apt-get update && apt-get install -y --no-install-recommends python3 ca-certificates && python3 scripts/build_android_rootfs.py ${{ matrix.abi }} /src/build/android-runtime-image /tmp/runtime-work'
      - uses: actions/cache/save@v4
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        with:
          path: build/android-runtime-image
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}
  android:
    needs: [test, android-image]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/flutter
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache/restore@v4
        with:
          path: build/android-runtime-image
          key: android-runtime-arm64-v8a-${{ hashFiles('scripts/build_android_rootfs.py', 'scripts/android_runtime_versions.json') }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: build/android-runtime-image
          key: android-runtime-armeabi-v7a-${{ hashFiles('scripts/build_android_rootfs.py', 'scripts/android_runtime_versions.json') }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: build/android-runtime-image
          key: android-runtime-x86_64-${{ hashFiles('scripts/build_android_rootfs.py', 'scripts/android_runtime_versions.json') }}
          fail-on-cache-miss: true
      - name: Embed all architectures in one offline application
        run: |
          mkdir -p apps/devcat_flutter/android/app/src/main/assets/runtime
          for abi in arm64-v8a armeabi-v7a x86_64; do
            bash scripts/build_android_proot.sh "$ANDROID_SDK_ROOT/ndk/28.2.13676358" "$abi" "apps/devcat_flutter/android/app/src/main/jniLibs/$abi"
            mv build/android-runtime-image/$abi.json build/android-runtime-image/$abi.zip apps/devcat_flutter/android/app/src/main/assets/runtime/
          done
      - name: Configure persistent signing when owner has installed secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/android_signing_config.py
      - working-directory: apps/devcat_flutter
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release --target-platform=android-arm,android-arm64,android-x64 --build-number=5005
      - run: |
          mkdir -p dist/android-build-inputs
          mv apps/devcat_flutter/build/app/outputs/flutter-apk/app-release.apk dist/android-build-inputs/
          python3 -c "from pathlib import Path; p=Path('dist/android-build-inputs/app-release.apk'); assert p.stat().st_size < 2*1024**3, 'APK exceeds GitHub file limit'"
      - uses: actions/upload-artifact@v4
        with:
          name: devcat-android-build-inputs-universal
          path: dist/android-build-inputs/app-release.apk
          compression-level: 0
          if-no-files-found: error
