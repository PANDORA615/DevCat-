name: Build and verify DevCat
on:
  push:
    branches: [main, 'feature/bundled-desktop-runtimes']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-device:
    uses: ./.github/workflows/android-runtime.yml
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y clang libsqlite3-dev
      - name: Initialize .NET before concurrent compiler tests
        run: dotnet --version
      - working-directory: apps/devcat_flutter
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          DEVCAT_REQUIRE_ALL_TOOLCHAINS=true flutter test --reporter expanded --concurrency=2
      - run: python3 scripts/write_content.py && python3 -m unittest discover -s scripts -p 'test_*.py' -v && git diff --exit-code -- content apps/devcat_flutter/assets/content docs/textbooks docs/DevCat-lectures.zip
  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
          - os: windows-2022
            target: windows
          - os: macos-15
            target: macos
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        id: desktop-sdk-cache
        with:
          path: build/desktop-downloads
          key: desktop-sdk-archives-${{ runner.os }}-${{ hashFiles('scripts/desktop_runtime_versions.json') }}
      - name: Bundle verified portable compilers and interpreters
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            windows) platforms="--platform windows-x64" ;;
            linux) platforms="--platform linux-x64" ;;
            macos) platforms="--platform macos-x64 --platform macos-arm64" ;;
          esac
          python scripts/bundle_desktop_runtimes.py $platforms --output build/desktop-runtime
      - uses: actions/cache/save@v4
        if: steps.desktop-sdk-cache.outputs.cache-hit != 'true'
        with:
          path: build/desktop-downloads
          key: ${{ steps.desktop-sdk-cache.outputs.cache-primary-key }}
      - name: Verify bundled tools and the real curriculum without system SDK lookup
        working-directory: apps/devcat_flutter
        shell: bash
        env:
          DEVCAT_REQUIRE_BUNDLED: 'true'
          DEVCAT_ISOLATE_TOOLS: 'true'
          DEVCAT_REQUIRE_ALL_TOOLCHAINS: 'true'
        run: |
          export DEVCAT_RUNTIME_DIR="$GITHUB_WORKSPACE/build/desktop-runtime"
          flutter pub get --enforce-lockfile
          flutter test test/desktop_runtime_test.dart test/curriculum_test.dart --reporter expanded --concurrency=1
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good rpm zstd xvfb xauth libicu70 libssl3
      - working-directory: apps/devcat_flutter
        run: flutter pub get --enforce-lockfile
      - working-directory: apps/devcat_flutter
        run: flutter build ${{ matrix.target }} --release --dart-define=DEVCAT_BUNDLED_DESKTOP=true
      - name: Include the verified runtimes and audit the final desktop bundle
        shell: bash
        run: python scripts/finish_desktop_bundle.py ${{ matrix.target }}
      - if: matrix.target == 'macos'
        run: codesign --force --deep --sign - apps/devcat_flutter/build/macos/Build/Products/Release/DevCat.app
      - name: Run all eight languages through the packaged app
        shell: bash
        run: python scripts/verify_packaged_desktop.py ${{ matrix.target }}
      - if: matrix.target == 'linux'
        run: scripts/package_linux.sh 0.8.0
      - if: matrix.target == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          # Inno enumerates some .NET SDK paths through MAX_PATH APIs.
          # A short junction avoids changing or omitting any bundled files.
          $bundle = (Resolve-Path apps/devcat_flutter/build/windows/x64/runner/Release).Path
          $shortBundle = Join-Path $env:RUNNER_TEMP 'dc'
          New-Item -ItemType Junction -Path $shortBundle -Target $bundle
          Compress-Archive -Path "$shortBundle/*" -DestinationPath dist/DevCat-0.8.0-windows-x64.zip
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DBundleDir=$shortBundle" scripts/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: matrix.target == 'macos'
        run: |
          mkdir -p dist
          app=apps/devcat_flutter/build/macos/Build/Products/Release/DevCat.app
          codesign --force --deep --sign - "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/DevCat-0.8.0-macos-universal.zip
          mkdir -p /tmp/devcat-dmg
          cp -cR "$app" /tmp/devcat-dmg/DevCat.app || ditto "$app" /tmp/devcat-dmg/DevCat.app
          ln -s /Applications /tmp/devcat-dmg/Applications
          hdiutil create -volname DevCat -srcfolder /tmp/devcat-dmg -ov -format UDZO dist/DevCat-0.8.0-macos-universal.dmg
      - name: Record exact package checksums
        shell: bash
        run: python scripts/desktop_package_checksums.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: devcat-desktop-proof-${{ matrix.target }}
          path: build/desktop-proof-${{ matrix.target }}.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: devcat-${{ matrix.target }}
          compression-level: 0
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.zst
            dist/*.AppImage
            dist/*.zip
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
  android-image:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: android-arm64
          - abi: armeabi-v7a
            target: android-arm
          - abi: x86_64
            target: android-x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/flutter
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache/restore@v4
        id: runtime-cache
        with:
          path: build/android-runtime-image
          key: android-runtime-${{ matrix.abi }}-${{ hashFiles('scripts/build_android_rootfs.py', 'scripts/android_runtime_versions.json') }}
      - name: Build offline compiler image
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/android-runtime-image
          docker run --rm --mount type=bind,src="$PWD",dst=/src -w /src debian:bookworm-slim bash -lc 'apt-get update && apt-get install -y --no-install-recommends python3 ca-certificates && python3 scripts/build_android_rootfs.py ${{ matrix.abi }} /src/build/android-runtime-image /tmp/runtime-work'
      - uses: actions/cache/save@v4
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        with:
          path: build/android-runtime-image
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}
      - name: Pass the exact image to the universal packaging job
        uses: actions/upload-artifact@v4
        with:
          name: devcat-runtime-image-${{ matrix.abi }}
          path: |
            build/android-runtime-image/${{ matrix.abi }}.json
            build/android-runtime-image/${{ matrix.abi }}.zip
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  android:
    needs: [test, android-image]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/flutter
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
          log-accepted-android-sdk-licenses: false
      - name: Receive all three images from this exact workflow run
        uses: actions/download-artifact@v4
        with:
          path: build/android-runtime-image
          pattern: devcat-runtime-image-*
          merge-multiple: true
      - name: Compact optional SDK files without removing compilers
        run: python3 scripts/compact_android_image.py build/android-runtime-image
      - name: Embed all architectures in one offline application
        run: |
          mkdir -p apps/devcat_flutter/android/app/src/main/assets/runtime
          for abi in arm64-v8a armeabi-v7a x86_64; do
            bash scripts/build_android_proot.sh "$ANDROID_SDK_ROOT/ndk/28.2.13676358" "$abi" "apps/devcat_flutter/android/app/src/main/jniLibs/$abi"
            mv build/android-runtime-image/$abi.json build/android-runtime-image/$abi.zip apps/devcat_flutter/android/app/src/main/assets/runtime/
          done
      - name: Configure persistent signing when owner has installed secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/android_signing_config.py
      - working-directory: apps/devcat_flutter
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release --target-platform=android-arm,android-arm64,android-x64 --build-number=5009
      - run: |
          mkdir -p dist/android-build-inputs
          mv apps/devcat_flutter/build/app/outputs/flutter-apk/app-release.apk dist/android-build-inputs/
          python3 -c "from pathlib import Path; p=Path('dist/android-build-inputs/app-release.apk'); assert p.stat().st_size < 2*1024**3, 'APK exceeds GitHub file limit'"
      - uses: actions/upload-artifact@v4
        with:
          name: devcat-android-build-inputs-universal
          path: dist/android-build-inputs/app-release.apk
          compression-level: 0
          if-no-files-found: error
