name: Verify offline Android runtimes
on:
  push:
    branches: [feature/android-local-runtimes]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-offline:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/flutter
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
          log-accepted-android-sdk-licenses: false
      - name: Cache verified offline compiler image
        id: runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: build/android-runtime-image
          key: android-runtime-x64-${{ hashFiles('scripts/build_android_rootfs.py', 'scripts/android_runtime_versions.json') }}
      - name: Build compiler image
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/android-runtime-image
          docker run --rm --mount type=bind,src="$PWD",dst=/src -w /src debian:bookworm-slim bash -lc 'apt-get update && apt-get install -y --no-install-recommends python3 ca-certificates && python3 scripts/build_android_rootfs.py x86_64 /src/build/android-runtime-image /tmp/runtime-work'
      - name: Save verified image before device tests
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/android-runtime-image
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}
      - name: Package native loader and matching compiler image
        run: |
          bash scripts/build_android_proot.sh "$ANDROID_SDK_ROOT/ndk/28.2.13676358" x86_64 apps/devcat_flutter/android/app/src/main/jniLibs/x86_64
          mkdir -p apps/devcat_flutter/android/app/src/main/assets/runtime
          cp build/android-runtime-image/x86_64.* apps/devcat_flutter/android/app/src/main/assets/runtime/
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - working-directory: apps/devcat_flutter
        run: flutter pub get --enforce-lockfile
      - name: Execute from real Android app process with networking disabled
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          cores: 2
          ram-size: 4096M
          disk-size: 8G
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            cd apps/devcat_flutter && flutter test integration_test/android_runtime_test.dart -d emulator-5554 --reporter expanded --timeout 60m
      - if: always()
        run: timeout 20s adb logcat -d -t 4000 > android-runtime-logcat.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-diagnostics
          path: |
            android-runtime-logcat.txt
            build/android-runtime-image/x86_64.json
