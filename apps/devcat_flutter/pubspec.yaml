name: devcat
description: Локальная мастерская программирования с котом-наставником.
publish_to: none
version: 0.9.2+5009
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.5
  path: ^1.9.1
  url_launcher: ^6.3.2
  share_plus: ^12.0.0
  file_selector: ^1.0.3
  flutter_secure_storage: ^9.2.4
  cryptography: ^2.7.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.0
  audioplayers: ^6.1.0
  flutter_code_editor: ^0.3.3
  highlight: ^0.7.0
  sqlite3: ^2.7.4
  sqlite3_flutter_libs: ^0.5.29
  dynamic_color: ^1.7.0
  window_manager: ^0.5.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/fonts/
    - assets/branding/
    - assets/content/
    - assets/mascot/views/student/
    - assets/mascot/models/evolution/
    - assets/mascot/models/costumes/
    - assets/mascot/manifests/
    - assets/mascot/animations/student/walk/
    - assets/mascot/animations/student/waiting/
    - assets/mascot/animations/student/typing/
    - assets/mascot/animations/student/thoughtful/
    - assets/mascot/animations/student/thinking/
    - assets/mascot/animations/student/text_typing/
    - assets/mascot/animations/student/talk/
    - assets/mascot/animations/student/surprised/
    - assets/mascot/animations/student/success/
    - assets/mascot/animations/student/sleepy/
    - assets/mascot/animations/student/sleeping/
    - assets/mascot/animations/student/shy/
    - assets/mascot/animations/student/sad/
    - assets/mascot/animations/student/run/
    - assets/mascot/animations/student/reading/
    - assets/mascot/animations/student/orientations/
    - assets/mascot/animations/student/notification/
    - assets/mascot/animations/student/new/
    - assets/mascot/animations/student/loading/
    - assets/mascot/animations/student/land/
    - assets/mascot/animations/student/jump/
    - assets/mascot/animations/student/idle/
    - assets/mascot/animations/student/idea/
    - assets/mascot/animations/student/happy/
    - assets/mascot/animations/student/greeting/
    - assets/mascot/animations/student/failure/
    - assets/mascot/animations/student/explaining/
    - assets/mascot/animations/student/excited/
    - assets/mascot/animations/student/error/
    - assets/mascot/animations/student/celebrating/
    - assets/mascot/animations/student/blink/
    - assets/mascot/animations/student/angry/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
