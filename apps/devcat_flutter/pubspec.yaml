name: devcat
description: Локальная мастерская программирования с котом-наставником.
publish_to: none
version: 0.3.0+4
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.5
  path: ^1.9.1
  share_plus: ^12.0.0
  file_selector: ^1.0.3
  flutter_secure_storage: ^9.2.4
  cryptography: ^2.7.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.0
  audioplayers: ^6.1.0
  flutter_code_editor: ^0.3.3
  highlight: ^0.7.0
  sqlite3: ^2.7.4
  sqlite3_flutter_libs: ^0.5.29
  dynamic_color: ^1.7.0
  window_manager: ^0.5.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/fonts/
    - assets/branding/
    - assets/content/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
